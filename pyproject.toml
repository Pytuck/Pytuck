[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytuck"
version = "1.3.0"
description = "Lightweight Python document database - No SQL, multi-engine, pluggable persistence"
readme = "README.md"
license = "MIT"
authors = [
    {name = "go9sky"}
]
maintainers = [
    {name = "go9sky"}
]
keywords = [
    "database",
    "orm",
    "nosql",
    "document-database",
    "python",
    "lightweight",
    "pytuck",
    "embedded-database",
    "key-value-store"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
json = []
orjson = ["orjson>=3.8.0"]
csv = []
sqlite = []
duckdb = [
    "duckdb",
    "pytz>=2026.1.post1",
]
excel = ["openpyxl>=3.0.0"]
xml = ["lxml>=4.9.0"]
all = [
    "duckdb",
    "openpyxl>=3.0.0",
    "lxml>=4.9.0",
    "orjson>=3.8.0",
    "pytz>=2026.1.post1",
]
view = ["openpyxl>=3.0.0", "lxml>=4.9.0", "orjson>=3.8.0"]
dev = [
    "pytest>=7.0.0",
    "mypy>=0.950",
    "build>=0.7.0",
    "twine>=4.0.0",
    "duckdb",
    "openpyxl>=3.0.0",
    "lxml>=4.9.0",
    "orjson>=3.8.0",
    "pytz>=2026.1.post1",
]

[project.urls]
Homepage = "https://github.com/Pytuck/Pytuck"
Documentation = "https://github.com/Pytuck/Pytuck#readme"
Repository = "https://github.com/Pytuck/Pytuck.git"
Issues = "https://github.com/Pytuck/Pytuck/issues"
Changelog = "https://github.com/Pytuck/Pytuck/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = [
    "pytuck",
    "pytuck.backends",
    "pytuck.common",
    "pytuck.connectors",
    "pytuck.core",
    "pytuck.query",
    "pytuck.tools",
]
include-package-data = true

[tool.setuptools.package-data]
pytuck = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313', 'py314']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# 排除 benchmark 目录
norecursedirs = ["benchmark", "__pycache__"]
addopts = "-v"

[dependency-groups]
dev = [
    "pytz>=2026.1.post1",
]
