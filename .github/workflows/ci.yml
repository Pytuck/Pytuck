name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  zero-dependency:
    name: Zero-dependency wheel smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python 3.10
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
          enable-cache: true
          cache-suffix: ubuntu-latest-3.10-zero-dependency

      - name: Build wheel
        run: uv build

      - name: Install wheel without dependencies
        run: |
          uv venv --python 3.10 .zero-venv
          uv pip install --python .zero-venv/bin/python --no-deps dist/*.whl

      - name: Run zero-dependency smoke
        run: .zero-venv/bin/python tests/zero_dependency_smoke.py

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: ${{ runner.os }}-${{ matrix.python-version }}
          cache-dependency-glob: |
            pyproject.toml

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/ -v

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: ubuntu-latest-3.12-type-check
          cache-dependency-glob: |
            pyproject.toml

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run mypy
        run: uv run mypy pytuck/ --ignore-missing-imports
